<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>@quivlss</title>
<link href="https://fonts.cdnfonts.com/css/chillax" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body,*{font-family:'Chillax',sans-serif!important;}

:root{
  --text:#ffffff;
  --text-darker:rgba(255,255,255,0.5);
  --icon:#ffffff;
  --bg:#000000;
  --container:rgba(0,0,0,0.1);
  --container-radius:80px;
  --container-width:44rem;
  --presence-bg:rgba(0,0,0,0.2);
  --presence-border:2px solid rgba(0,0,0,0.1);
  --badge-bg:rgba(0,0,0,0.2);
  --badge-border:2px solid rgba(0,0,0,0.04);
  --separator:rgba(255,255,255,0.12);
  --vol-bg:rgba(0,0,0,0.1);
  --vol-border:2px solid rgba(0,0,0,0.09);
}

html,body{height:100%;overflow:hidden;background:#000;color:#fff;cursor:default;}

/* VIDEO BG */
#bgvid{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;pointer-events:none;
}

/* ENTER OVERLAY */
#overlay{
  position:fixed;inset:0;z-index:50;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.92);
  transition:opacity .5s;
  cursor:pointer;
}
#overlay-text{font-size:28px;font-weight:700;color:#fff;letter-spacing:.03em;}

/* VOLUME — top left */
#vol{
  position:fixed;top:18px;left:18px;z-index:20;
  display:none;align-items:center;gap:8px;
  background:var(--vol-bg);border:var(--vol-border);
  border-radius:30px;padding:7px 12px;
}
#vol svg{width:18px;height:18px;color:rgba(255,255,255,.75);flex-shrink:0;}
#vol input[type=range]{
  -webkit-appearance:none;width:80px;height:3px;
  border-radius:3px;background:rgba(255,255,255,0.35);outline:none;cursor:pointer;
}
#vol input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:11px;height:11px;
  border-radius:50%;background:#fff;cursor:pointer;
}

/* PAGE WRAPPER */
#page{
  position:fixed;inset:0;z-index:2;
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;transition:opacity .6s;
}
#page.show{opacity:1;pointer-events:all;}

/* PARALLAX CARD WRAP */
#parallax{
  width:100%;max-width:var(--container-width);
  transition:transform 700ms cubic-bezier(.03,.98,.52,.99);
  will-change:transform;
  display:flex;flex-direction:column;gap:15px;align-items:center;
}

/* MAIN CARD — modern layout */
.card{
  width:100%;
  background:var(--container);
  border-radius:var(--container-radius);
  padding:26px;
  backdrop-filter:blur(0px);
}

/* TOP ROW: avatar left, info right */
.card-top{
  display:flex;align-items:center;gap:20px;
}
.avatar-wrap{flex-shrink:0;}
.avatar-wrap img{
  width:88px;height:88px;border-radius:35%;
  border:2px solid rgba(0,0,0,.4);object-fit:cover;display:block;
}
.card-info{flex:1;min-width:0;}
.name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.name-row h1{font-size:34px;font-weight:600;line-height:1.1;color:#fff;}
.description{font-size:17px;font-weight:570;color:#fff;margin-bottom:4px;}
.joindate{font-size:13px;font-weight:400;color:rgba(255,255,255,.65);}

/* SEPARATOR */
.sep{width:100%;height:1px;background:var(--separator);margin:16px 0;}

/* DISCORD PRESENCE */
.presence{
  width:100%;background:var(--presence-bg);
  border:var(--presence-border);border-radius:16px;padding:13px 14px;
  display:flex;align-items:center;gap:12px;
}
.presence-av-wrap{position:relative;flex-shrink:0;}
.presence-av{
  width:48px;height:48px;border-radius:50%;
  border:2px solid rgba(0,0,0,.15);object-fit:cover;display:block;
}
.presence-dot{
  position:absolute;bottom:1px;right:1px;width:13px;height:13px;
  border-radius:50%;background:#f0b232;border:2px solid #111;
}
.presence-info{flex:1;min-width:0;}
.presence-name{
  font-size:17px;font-weight:550;color:#fff;
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
}
.guild-tag{
  font-size:10px;font-weight:600;letter-spacing:.05em;
  background:rgba(255,255,255,.1);border-radius:4px;
  padding:1px 6px;color:rgba(255,255,255,.7);
}
.presence-status{font-size:13.5px;font-weight:400;color:rgba(255,255,255,.65);margin-top:2px;}

/* SOCIALS ROW — right aligned */
.socials-row{
  width:100%;display:flex;justify-content:flex-end;
  align-items:center;gap:18px;padding:0 2px;
  margin-bottom:8px;
}
.soc{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:none;border:none;cursor:pointer;padding:0;color:#fff;
  transition:transform .15s;
}
.soc:hover{transform:scale(1.18);}
.soc svg{width:22px;height:22px;color:#fff;}
.soc a{display:flex;align-items:center;justify-content:center;color:inherit;}

/* BOTTOM META — views + (no location for quivlss) */
.card-bottom{
  position:relative;padding-top:4px;
}
.views-label{
  font-size:14px;font-weight:550;color:rgba(255,255,255,.6);
  display:flex;align-items:center;gap:5px;
}
.views-label svg{width:15px;height:15px;}

/* TOAST */
#toast{
  position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(16px);
  background:rgba(15,15,15,.95);border:1px solid rgba(255,255,255,.1);
  color:#fff;padding:7px 18px;border-radius:30px;
  font-size:13px;font-weight:500;z-index:99;
  opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<video id="bgvid" src="https://r2.guns.lol/e93c7acd-fde4-474f-8d2e-0f01514b163b.mp4"
  loop playsinline disablepictureinpicture preload="auto" muted></video>

<!-- ENTER OVERLAY -->
<div id="overlay">
  <span id="overlay-text">welcome, click to enter</span>
</div>

<!-- VOLUME -->
<div id="vol">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="currentColor">
    <defs><mask id="vm"><g fill="none" stroke="#fff" stroke-width="4">
      <path fill="#555" stroke-linejoin="round" d="M24 6v36c-7 0-12.201-9.16-12.201-9.16H6a2 2 0 0 1-2-2V17.01a2 2 0 0 1 2-2h5.799S17 6 24 6Z"/>
      <path stroke-linecap="round" stroke-linejoin="round" d="M32 15a11.91 11.91 0 0 1 1.684 1.859A12.07 12.07 0 0 1 36 24c0 2.654-.846 5.107-2.278 7.09A11.936 11.936 0 0 1 32 33"/>
      <path stroke-linecap="round" d="M34.236 41.186C40.084 37.696 44 31.305 44 24c0-7.192-3.796-13.496-9.493-17.02"/>
    </g></mask></defs>
    <path fill="currentColor" d="M0 0h48v48H0z" mask="url(#vm)"/>
  </svg>
  <input type="range" id="volslider" min="0" max="100" value="100">
</div>

<!-- PAGE -->
<div id="page">
  <div id="parallax">

    <!-- MAIN CARD -->
    <div class="card">
      <!-- TOP: avatar + name/bio -->
      <div class="card-top">
        <div class="avatar-wrap">
          <img src="https://cdn.discordapp.com/avatars/1405331957050511413/35c6e65cc397dcc2b4bccc18256a7d37.webp?size=512" alt="avatar">
        </div>
        <div class="card-info">
          <div class="name-row">
            <h1>quivls</h1>
          </div>
          <div class="description">bosnian, eu, i play on vr, and minecraft!</div>
          <div class="joindate">Joined 7 months ago</div>
        </div>
      </div>

      <div class="sep"></div>

      <!-- DISCORD PRESENCE -->
      <div class="presence">
        <div class="presence-av-wrap">
          <img class="presence-av" src="https://cdn.discordapp.com/avatars/1405331957050511413/35c6e65cc397dcc2b4bccc18256a7d37.webp?size=512" alt="">
          <div class="presence-dot"></div>
        </div>
        <div class="presence-info">
          <div class="presence-name">
            quivlss
            <span class="guild-tag">VΛRR</span>
          </div>
          <div class="presence-status">🦨</div>
        </div>
      </div>
    </div>

    <!-- SOCIALS + BOTTOM META card -->
    <div class="card" style="padding:18px 26px;">
      <div class="socials-row">

        <!-- Discord → copy @quivlss -->
        <button class="soc" onclick="doCopy('@quivlss')" title="Discord">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="1.96 4.26 20.03 15.53" fill="currentColor">
            <path d="M14.82 4.26a10.14 10.14 0 0 0-.53 1.1a14.66 14.66 0 0 0-4.58 0a10.14 10.14 0 0 0-.53-1.1a16 16 0 0 0-4.13 1.3a17.33 17.33 0 0 0-3 11.59a16.6 16.6 0 0 0 5.07 2.59A12.89 12.89 0 0 0 8.23 18a9.65 9.65 0 0 1-1.71-.83a3.39 3.39 0 0 0 .42-.33a11.66 11.66 0 0 0 10.12 0q.21.18.42.33a10.84 10.84 0 0 1-1.71.84a12.41 12.41 0 0 0 1.08 1.78a16.44 16.44 0 0 0 5.06-2.59a17.22 17.22 0 0 0-3-11.59a16.09 16.09 0 0 0-4.09-1.35zM8.68 14.81a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.93 1.93 0 0 1 1.8 2a1.93 1.93 0 0 1-1.8 2zm6.64 0a1.94 1.94 0 0 1-1.8-2a1.93 1.93 0 0 1 1.8-2a1.92 1.92 0 0 1 1.8 2a1.92 1.92 0 0 1-1.8 2z"/>
          </svg>
        </button>

        <!-- Roblox → profile link -->
        <div class="soc">
          <a href="https://www.roblox.com/users/9684460536/profile" target="_blank" title="Roblox">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0.16 0 23.68 24" fill="currentColor">
              <path d="M5.164 0L.16 18.928L18.836 24L23.84 5.072Zm8.747 15.354l-5.219-1.417l1.399-5.29l5.22 1.418l-1.4 5.29z"/>
            </svg>
          </a>
        </div>

        <!-- Twitch → nothing -->
        <div class="soc" style="opacity:.35;cursor:default;" title="Twitch">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="1.71 0 20.57 24" fill="currentColor">
            <path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
          </svg>
        </div>

        <!-- TikTok → nothing -->
        <div class="soc" style="opacity:.35;cursor:default;" title="TikTok">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="3.2 2 17.43 19.99" fill="currentColor">
            <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74a2.89 2.89 0 0 1 2.31-4.64a2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
          </svg>
        </div>

      </div>

      <!-- VIEWS -->
      <div class="card-bottom">
        <span class="views-label">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 9a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 8a5 5 0 0 1-5-5a5 5 0 0 1 5-5a5 5 0 0 1 5 5a5 5 0 0 1-5 5m0-12.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5"/></svg>
          20
        </span>
      </div>
    </div>

  </div>
</div>

<div id="toast">Copied!</div>

<script>
const overlay = document.getElementById('overlay');
const page    = document.getElementById('page');
const vid     = document.getElementById('bgvid');
const volEl   = document.getElementById('vol');
const slider  = document.getElementById('volslider');
const par     = document.getElementById('parallax');

overlay.addEventListener('click', () => {
  overlay.style.opacity = '0';
  overlay.style.pointerEvents = 'none';
  setTimeout(() => overlay.style.display = 'none', 500);
  page.classList.add('show');
  vid.play().catch(()=>{});
  volEl.style.display = 'flex';
});

slider.addEventListener('input', () => { vid.volume = slider.value / 100; });

// Parallax tilt
document.addEventListener('mousemove', e => {
  if (!page.classList.contains('show')) return;
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const rx = ((e.clientY - cy) / cy) * -6;
  const ry = ((e.clientX - cx) / cx) * 6;
  par.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg) scale3d(1,1,1)`;
});
document.addEventListener('mouseleave', () => {
  par.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1,1,1)';
});

function doCopy(txt) {
  navigator.clipboard.writeText(txt).catch(() => {
    const t = document.createElement('textarea');
    t.value = txt; document.body.appendChild(t); t.select();
    document.execCommand('copy'); document.body.removeChild(t);
  });
  const toast = document.getElementById('toast');
  toast.textContent = 'Copied ' + txt;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}
</script>
</body>
</html>
